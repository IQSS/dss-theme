title: DSS theme
author: IQSS Data Science Services
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  project:
    project:
      type: website
    website:
      favicon: assets/favicon.png
      navbar:
        title: false
        pinned: true
        logo: assets/dss-logo.svg
        logo-alt: "Data Science Services"
        logo-href: https://www.iq.harvard.edu/data-science-services
        background: "#ffffff"
        right:
          - text: "Training materials"
            href: https://iqss.github.io/dss-training/
          - text: "Data Science Services"
            href: https://www.iq.harvard.edu/data-science-services
          - text: "Request help"
            href: https://www.iq.harvard.edu/data-science-services/contact-us
      page-footer:
        left: "Data Science Services · Institute for Quantitative Social Science · Harvard University"
        right:
          - text: "Data Science Services"
            href: https://www.iq.harvard.edu/data-science-services
          - text: "Request help"
            href: https://www.iq.harvard.edu/data-science-services/contact-us
          - text: "IQSS"
            href: https://www.iq.harvard.edu/
    format:
      dss-theme-html: default
  formats:
    html:
      theme: [cosmo, dss.scss]
      toc: true
      code-copy: true
      callout-appearance: simple
      link-external-newwindow: true
      include-in-header:
        - text: '<meta name="theme-color" content="#3C72B4">'
